<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2c2d31"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="58%" r="46%">
      <stop offset="0" stop-color="#ddf36f" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ddf36f" stop-opacity="0"/>
    </radialGradient>
    <!-- glass body: clear at the top, lime liquid towards the bottom -->
    <linearGradient id="body" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ddf36f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ddf36f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rim" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f1ffb0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ffb3"/>
      <stop offset="1" stop-color="#c7e43f"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="512" cy="560" r="300"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="590" r="430" fill="url(#halo)"/>
  <ellipse cx="512" cy="900" rx="250" ry="34" fill="#000" opacity="0.6" filter="url(#soft)"/>
  <!-- glass globe -->
  <circle cx="512" cy="560" r="300" fill="url(#body)"/>
  <g clip-path="url(#ball)" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="6">
    <ellipse cx="512" cy="560" rx="128" ry="300"/>
    <ellipse cx="512" cy="560" rx="300" ry="86"/>
  </g>
  <!-- liquid surface line -->
  <path d="M222 640 Q512 690 802 640" fill="none" stroke="#f6ffcc" stroke-opacity="0.7" stroke-width="5" clip-path="url(#ball)"/>
  <ellipse cx="430" cy="395" rx="150" ry="70" transform="rotate(-28 430 395)" fill="url(#spec)"/>
  <circle cx="512" cy="560" r="298" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <!-- lime pin -->
  <g filter="url(#drop)" transform="translate(512 300)">
    <path d="M0 150 C -26 104 -98 58 -98 -6 A98 98 0 1 1 98 -6 C 98 58 26 104 0 150 Z" fill="url(#pin)"/>
    <path d="M-80 -40 A90 90 0 0 1 60 -88" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="10" stroke-linecap="round"/>
    <line x1="-22" y1="-52" x2="-22" y2="46" stroke="#1b1f05" stroke-width="16" stroke-linecap="round"/>
    <path d="M-22 -52 L48 -30 L-22 -6 Z" fill="#1b1f05" stroke="#1b1f05" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
